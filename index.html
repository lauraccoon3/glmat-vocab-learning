}</td><td>${x.ok}/${x.n} 정답</td></tr>`).join('')}</tbody></table>`:'<div class="empty">첫 문제를 풀면 학습 기록이 쌓입니다.</div>'}</div>`}
function startRound(r){currentPool=shuffle(words.filter(x=>x.round===r));current={mode:'round',round:r,index:0,answers:[],locked:false};show('quiz');renderQuiz()}
function renderQuiz(){let root=document.querySelector('#quiz');if(!current){root.innerHTML='<div class="card empty">대시보드에서 학습할 회차를 선택하세요.</div>';return}if(current.index>=currentPool.length){finishQuiz();return} let q=currentPool[current.index], type=current.index%2?'example':'meaning'; let opts=shuffle([q,...shuffle(words.filter(x=>x.id!==q.id)).slice(0,4)]); let prompt=type==='meaning'?`<b>‘${esc(q.w)}’</b>의 뜻으로 가장 알맞은 것은 무엇일까요?`:`다음 문장에서 빈칸에 들어갈 말로 가장 알맞은 것은?<br><br><span class="small">“그 상황은 <b>${esc(q.m)}</b>이라고 설명할 수 있다. 이를 한 단어로 하면 ‘_____’이다.”</span>`;root.innerHTML=`<div class="card"><div class="question-head"><span>${current.mode==='round'?`${current.round}회차 학습`:'오답 재시험'}</span><span>${current.index+1} / ${currentPool.length}</span></div><div class="bar" style="margin-top:10px"><i style="width:${current.index/currentPool.length*100}%"></i></div><span class="question-type">${type==='meaning'?'뜻 고르기':'예문 고르기'}</span><p class="prompt">${prompt}</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-id="${o.id}" onclick="answer(${o.id})"><b>${i+1}. </b>${type==='meaning'?esc(o.m):esc(o.w)}</button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="primary" id="next" disabled onclick="nextQuestion()">다음 문제</button></div></div>`}
function answer(choiceId){if(current.locked)return;current.locked=true;let q=currentPool[current.index],ok=choiceId===q.id,type=current.index%2?'example':'meaning';document.querySelectorAll('.choice').forEach(b=>{if(+b.dataset.id===q.id)b.classList.add('correct');else if(+b.dataset.id===choiceId)b.classList.add('wrong');b.disabled=true});state.answers.push({id:q.id,ok,type,at:Date.now(),mode:current.mode});current.answers.push(ok);document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'정답입니다!':'오답입니다.'} <b>${esc(q.w)}</b>: ${esc(q.m)}</div>`;document.querySelector('#next').disabled=false;localStorage.setItem(KEY,JSON.stringify(state))}
function nextQuestion(){current.index++;current.locked=false;renderQuiz()}
function finishQuiz(){let ok=current.answers.filter(Boolean).length;state.sessions.push({at:Date.now(),label:current.mode==='round'?`${current.round}회차 학습`:'오답 재시험',n:current.answers.length,ok});if(current.mode==='round'&&!state.roundDone.includes(current.round))state.roundDone.push(current.round);current=null;save();show('home')}
function renderRetry(){let ids=wrongIds(),root=document.querySelector('#retry');if(!ids.length){root.innerHTML='<div class="card empty">현재 재시험할 오답이 없습니다. 회차별 학습을 시작해 보세요.</div>';return}root.innerHTML=`<div class="card"><h2 style="margin-top:0">오답 재시험</h2><p class="small">한 번이라도 틀린 ${ids.length}개 단어를 다시 풉니다. 모두 맞히면 해당 회차가 완료됩니다.</p><button class="primary" onclick="startRetry()">오답 ${ids.length}개 다시 풀기</button></div><div class="word-list" style="margin-top:15px">${ids.map(id=>'<div class="word"><mark>'+esc(byId(id).w)+'</mark><small>'+esc(byId(id).m)+'</small></div>').join('')}</div>`}
function startRetry(){currentPool=shuffle(wrongIds().map(byId));current={mode:'retry',index:0,answers:[],locked:false};show('quiz');renderQuiz()}
function renderMatch(){let root=document.querySelector('#match');if(!matchState.items){const set=shuffle(words).slice(0,6);matchState={items:set,left:shuffle(set),right:shuffle(set),chosen:null,done:0};}let s=matchState;root.innerHTML=`<div class="card"><div class="question-head"><span>단어와 뜻을 연결하세요</span><span>${s.done}/6 연결</span></div><p class="small">왼쪽 단어와 오른쪽 뜻을 차례로 선택합니다. 틀리면 다시 도전할 수 있어요.</p><div class="bar"><i style="width:${s.done/6*100}%"></i></div><div class="match" style="margin-top:18px"><div class="match-list">${s.left.map(x=>`<button class="match-item ${s.chosen===x.id?'selected':''} ${s.paired?.includes(x.id)?'paired':''}" onclick="pickWord(${x.id})">${esc(x.w)}</button>`).join('')}</div><div class="match-list">${s.right.map(x=>`<button class="match-item ${s.paired?.includes(x.id)?'paired':''}" onclick="pickMeaning(${x.id},this)">${esc(x.m)}</button>`).join('')}</div></div>${s.done===6?'<div class="feedback ok">완료! 새로운 6개 단어로 다시 할 수 있습니다.</div><div class="actions"><button class="primary" onclick="newMatch()">새 게임</button></div>':''}</div>`}
function pickWord(id){if(matchState.paired?.includes(id))return;matchState.chosen=id;renderMatch()}; function pickMeaning(id,el){if(!matchState.chosen||matchState.paired?.includes(id))return;let ok=id===matchState.chosen;state.match.push({id,ok,at:Date.now()});if(ok){matchState.paired=[...(matchState.paired||[]),id];matchState.done++;matchState.chosen=null}else{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500)}localStorage.setItem(KEY,JSON.stringify(state));renderMatch()}; function newMatch(){matchState={};renderMatch()}
function renderWords(){let highlight=wrongHistoryIds();let fully=[1,2,3,4].every(completed);document.querySelector('#words').innerHTML=`<div class="card"><h2 style="margin-top:0">전체 단어 200개</h2><p class="small">${fully?'학습 완료 상태입니다. 한 번이라도 틀린 단어를 형광펜으로 표시했습니다.':'4회차와 오답 재시험을 모두 마치면 오답 단어가 형광펜으로 강조됩니다.'}</p><div class="word-list">${words.map(x=>`<div class="word">${fully&&highlight.includes(x.id)?`<mark>${esc(x.w)}</mark>`:esc(x.w)}<small>${esc(x.m)}</small></div>`).join('')}</div></div>`}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(id==='quiz')renderQuiz();if(id==='match')renderMatch()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));renderAll();
</script></body></html>
